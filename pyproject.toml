[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-adam-gpt2-portfolio"
version = "0.1.0"
description = "Checkpoint-compatible base/SFT release tools for a custom GPT-2-style dense model"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "tokenizers>=0.20,<0.24", "huggingface_hub>=1.16,<3", "safetensors>=0.5,<1"]

[tool.setuptools.packages.find]
include = ["gpt2_portfolio*"]
